name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package.json'

      - name: 📦 Install App Dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: 📱 Generate Native Android Project (Expo Prebuild)
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: 🛠️ Build Standalone APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: 🔍 Locate Built APK
        id: find_apk
        working-directory: app/android
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: WellCheck-Android-App
          path: app/android/${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "WellCheck v2.0.1 — Android APK (Pure Native Fix)"
          body: |
            ## 🛡️ WellCheck Elder Safety App — v2.0.1 Native Android APK Release

            A modern, accessibility-first mobile safety companion connecting seniors with family caregivers and volunteers in real-time.

            ### 🚀 What's Fixed & New in v2.0.1:
            - **📱 Pure React Native Native Primitives**: Replaced web DOM elements (`<div>`, `<span>`, `<button>`, `<input>`) with native React Native components (`View`, `Text`, `TouchableOpacity`, `TextInput`). Fixed startup crash (`Invariant Violation: View config not found for name div`).
            - **✨ Universal Style & Layout Engine**: Runtime converter for Tailwind classes to React Native StyleSheet without losing colors, padding, flexbox, or typography.
            - **🛡️ Auto Text String Wrapper**: Prevents React Native unhandled text exceptions.
            - **🎨 Lucide Native Icons**: Integrated `lucide-react-native` SVG rendering.
            - **👥 Multi-Elder Roster Switching**: Caregivers can monitor multiple senior loved ones from one dashboard and switch active context with 1 tap.
            - **⏰ Check-In Schedule Matrix & 3-Min Escalation**: Configurable daily check-ins with 180s live countdown and urgent takeover modal.
            - **🗺️ Interactive Maps & Telemetry**: Safe-zone presets and live GPS tracking with Google Maps universal deep links.
            - **💊 Enhanced Medication Manager**: Photo previews, dosage schedules, and compliance logs.
            - **🚨 Emergency SOS Dispatch**: Instant takeover modal with sirens and coordinates.
            - **🗣️ 20+ Language Voice Guidance**: Voice feedback with synchronized subtitle captions.
            - **🌙 Dark Mode**: WCAG AA-compliant night theme.
            - **🔐 First-Time Onboarding Login**: Role-selection and onboarding flow with top-bar logout buttons.
          files: app/android/${{ steps.find_apk.outputs.apk_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
