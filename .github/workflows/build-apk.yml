name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package.json'

      - name: 📦 Install App Dependencies
        working-directory: app
        run: npm ci || npm install --legacy-peer-deps

      - name: 📱 Generate Native Android Project (Expo Prebuild)
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: 🛠️ Setup Gradle & Build Standalone APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: WellCheck-Android-App
          path: app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "WellCheck v1.0.0 - Android APK Release"
          body: |
            ## 🛡️ WellCheck Elder Safety App — Standalone APK Release

            ### ✨ Included Features:
            - **🚨 1-Tap SOS**: 10-second countdown with native voice & audio alarms + one-tap phone call & SMS fallback.
            - **🔑 PIN Pairing System**: Real-time cross-device pairing between Elder and Caregiver dashboards.
            - **💊 Medicine Photo Capture**: Camera & Gallery support to photograph pills and prescriptions locally.
            - **🛡️ Daily Safety Check-In**: "I'm OK" status logging with 3-minute automatic escalation alerts.
            - **🗣️ Multilingual Voice Guidance**: 20+ regional languages (Hindi, Telugu, Tamil, Marathi, Bengali, English, etc.).
            - **☁️ Real-time Firestore Sync**: Live alerts, check-ins, and pairing state.
          files: |
            app/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
